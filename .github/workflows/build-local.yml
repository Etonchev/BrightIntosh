name: Build (local install)

on:
  workflow_dispatch:
  push:
    branches: [local-build]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project BrightIntosh.xcodeproj -scheme BrightIntosh \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            build

      - name: Zip app
        run: ditto -c -k --keepParent build/Build/Products/Release/BrightIntosh.app BrightIntosh.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BrightIntosh
          path: BrightIntosh.zip
